[package]
name = "contribution-grid"
# Do not change this in the main branch!
# On the release branches, this string will be automatically updated by CI


version = "2.0.2"


edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "A Rust crate for generating customizable, GitHub-style contribution heatmap graphs as images"
license = "MIT"
repository = "https://github.com/fazuh/contribution-grid"
keywords = ["graph", "visualization", "contribution", "heatmap"]
categories = ["visualization"]

[dependencies]
chrono = "0.4.43"
image = "0.25.9"
imageproc = "0.26.0"

[[bin]]
name = "gen_previews"
path = "src/bin/gen_previews.rs"

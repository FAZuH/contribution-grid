# Credit: Workflow configs based on https://github.com/Wynntils/Wynntils

name: Release & Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    uses: ./.github/workflows/_release.yml
    with:
      binary-name: contribution-grid
      platforms: linux
      publish-crates: true
    secrets: inherit
